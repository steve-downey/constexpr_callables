[project]
name = "beman-constexpr_callables"
version = "0.1.0"
description = "Constexpr Callables"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "cmake==4.3.2",
    "clang-format==22.1.5",
    "gcovr>=8.6",
    "pre-commit>=4.5.1",
]
# specgen, which generates papers/P3574/wording/ from the annotated headers
# (make wording). Its own group, since it is published only for Linux x86_64
# and is not needed to build or test the library.
wording = [
    "beman-specgen==0.47.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

# SPDX-License-Identifier: Apache-2.0 WITH LLVM-exception

name: Continuous Integration Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '30 15 * * 0'

concurrency:
  group: ${{format('{0}:{1}', github.repository, github.ref)}}
  cancel-in-progress: true

jobs:
  beman-submodule-check:
    uses: bemanproject/infra-workflows/.github/workflows/reusable-beman-submodule-check.yml@1.7.4

  preset-test:
    uses: bemanproject/infra-workflows/.github/workflows/reusable-beman-preset-test.yml@1.7.4
    with:
      # The AppleClang and MSVC presets lack either std::constant_wrapper or
      # C++26 support, so only run the Linux presets for this proposal code.
      matrix_config: >
        [
          {"preset": "gcc-debug", "image": "ghcr.io/bemanproject/infra-containers-gcc:latest"},
          {"preset": "gcc-release", "image": "ghcr.io/bemanproject/infra-containers-gcc:latest"},
          {"preset": "llvm-debug", "image": "ghcr.io/bemanproject/infra-containers-clang:latest"},
          {"preset": "llvm-release", "image": "ghcr.io/bemanproject/infra-containers-clang:latest"}
        ]

  build-and-test:
    uses: bemanproject/infra-workflows/.github/workflows/reusable-beman-build-and-test.yml@1.7.4
    with:
      # function_ref depends on std::constant_wrapper, currently available in
      # the GCC 16 libstdc++ used by these Linux compiler images. Keep C++26
      # module builds out until the toolchains handle the std module imports.
      matrix_config: >
        {
          "gcc": [
            {
              "versions": ["16"],
              "tests": [
                {
                  "cxxversions": ["c++26"],
                  "tests": [
                    {
                      "stdlibs": ["libstdc++"],
                      "tests": [
                        "Debug.Default", "Release.Default", "Release.MaxSan",
                        "Debug.Werror", "Debug.Coverage"
                      ]
                    }
                  ]
                }
              ]
            }
          ],
          "clang": [
            {
              "versions": ["22"],
              "tests": [
                {
                  "cxxversions": ["c++26"],
                  "tests": [
                    {
                      "stdlibs": ["libstdc++"],
                      "tests": ["Debug.Default", "Release.Default", "Release.MaxSan", "Debug.Werror"]
                    }
                  ]
                }
              ]
            }
          ]
        }

  vcpkg-ci:
    uses: bemanproject/infra-workflows/.github/workflows/reusable-beman-vcpkg-ci.yml@1.7.4
    with:
      port_name: beman-constexpr-callables
      feature_combinations: '[{"features": {}}]'

  create-issue-when-fault:
    needs: [preset-test, build-and-test]
    if: failure() && github.event_name == 'schedule'
    uses: bemanproject/infra-workflows/.github/workflows/reusable-beman-create-issue-when-fault.yml@1.7.4
